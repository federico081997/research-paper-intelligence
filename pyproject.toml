[project]
name = "research-paper-intelligence"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "fastapi[standard]>=0.138.2",
    "httpx2>=2.5.0",
    "huggingface-hub>=1.20.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langgraph>=1.2.9",
    "numpy>=2.0",
    "pandas>=3.0.3",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.60.0",
    "torch>=2.12.1",
]

[project.scripts]
preprocess-papers = "research_paper_intelligence.cli.preprocess_dataset:main"
generate-embeddings = "research_paper_intelligence.cli.generate_embeddings:main"
generate-faiss-index = "research_paper_intelligence.cli.generate_faiss_index:main"
generate-tfidf-index = "research_paper_intelligence.cli.generate_tfidf_index:main"
run-api = "research_paper_intelligence.cli.run_api:main"
run-app = "research_paper_intelligence.cli.run_app:main"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pandas-stubs>=3.0.3.260530",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "scipy-stubs>=1.18.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_paper_intelligence"]

# -----------------------------------------------------------------------------
#   uv configuration
# -----------------------------------------------------------------------------

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# -----------------------------------------------------------------------------
#   Ruff: Formatting and Linting
# -----------------------------------------------------------------------------


[tool.ruff]
target-version = "py312"
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # Import sorting
    "B",      # flake8-bugbear
    "UP",     # Python syntax upgrades
    "D",      #pydocstyle docstring
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

# -----------------------------------------------------------------------------
#   Pytest Configuration
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "-vv",
    "--strict-markers",
    "--strict-config",
    "--cov=research_paper_intelligence",
    "--cov-report=term-missing",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]


# -----------------------------------------------------------------------------
#   Coverage Configuration
# -----------------------------------------------------------------------------

[tool.coverage.run]
source = ["research_paper_intelligence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

# -----------------------------------------------------------------------------
#   Mypy Type Checking
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
plugins = ["pydantic.mypy"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = false

[[tool.mypy.overrides]]
module = [
    "sklearn.*",
    "joblib",
    "joblib.*"
]
ignore_missing_imports = true


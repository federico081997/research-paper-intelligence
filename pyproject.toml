[project]
name = "research-paper-intelligence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.14.3",
    "numpy>=2.5.0",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_paper_intelligence"]

# -----------------------------------------------------------------------------
#   Ruff: Formatting and Linting
# -----------------------------------------------------------------------------


[tool.ruff]
target-version = "py312"
line-length = 79
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # Import sorting
    "B",      # flake8-bugbear
    "UP",     # Python syntax upgrades
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
#   Pytest Configuration
# -----------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "-vv",
    "--strict-markers",
    "--strict-config",
    "--cov=research_paper_intelligence",
    "--cov-report=term-missing"
]

# -----------------------------------------------------------------------------
#   Coverage Configuration
# -----------------------------------------------------------------------------

[tool.coverage.run]
source = ["research_paper_intelligence"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

# -----------------------------------------------------------------------------
#   Mypy Type Checking
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true


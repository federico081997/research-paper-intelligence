name: CI/CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.32"
  TEST_IMAGE: "research-paper-intelligence:test"
  DOCKER_CACHE_SCOPE: "research-paper-intelligence"

jobs:
  quality:
    name: Code quality and tests

    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_API_KEY: "test-google-api-key"
      RPI_ENVIRONMENT: "test"
      RPI_LOG_LEVEL: "INFO"
      RPI_DEVICE: "cpu"
      RPI_API_RELOAD: "false"
      RPI_STREAMLIT_HEADLESS: "true"
      RPI_STREAMLIT_RUN_ON_SAVE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lock file
        run: uv lock --check

      - name: Install project and development dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Run tests
        run: |
          uv run pytest \
            --junitxml=test-results.xml \
            --cov-report=xml:coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

  docker:
    name: Build and smoke-test Docker image

    needs:
      - quality

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create CI environment file
        run: |
          cat > .env <<'EOF'
          GOOGLE_API_KEY=test-google-api-key
          RPI_ENVIRONMENT=test
          RPI_LOG_LEVEL=INFO
          RPI_DEVICE=cpu
          RPI_API_RELOAD=false
          RPI_STREAMLIT_HEADLESS=true
          RPI_STREAMLIT_RUN_ON_SAVE=false
          EOF

          chmod 600 .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}

          # Attestations are only needed for the published image.
          provenance: false
          sbom: false

          cache-from: |
            type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: |
            type=gha,mode=min,scope=${{ env.DOCKER_CACHE_SCOPE }}

      - name: Smoke-test Docker image
        run: |
          docker run --rm -i \
            --entrypoint python \
            --env GOOGLE_API_KEY=test-google-api-key \
            --env RPI_ENVIRONMENT=test \
            --env RPI_LOG_LEVEL=INFO \
            --env RPI_DEVICE=cpu \
            --env RPI_API_RELOAD=false \
            --env RPI_STREAMLIT_HEADLESS=true \
            --env RPI_STREAMLIT_RUN_ON_SAVE=false \
            "${TEST_IMAGE}" - <<'PY'
          import sys

          import faiss
          import fastapi
          import numpy
          import pandas
          import research_paper_intelligence
          import sklearn
          import streamlit
          import torch
          import uvicorn

          from research_paper_intelligence.api.app import fastapi_app

          if torch.version.cuda is not None:
              raise RuntimeError(
                  "The Docker image contains a CUDA-enabled PyTorch build: "
                  f"{torch.version.cuda}"
              )

          if torch.cuda.is_available():
              raise RuntimeError(
                  "CUDA unexpectedly reports itself as available in the "
                  "CPU-only Docker image."
              )

          print("Python version:", sys.version)
          print(
              "Package location:",
              research_paper_intelligence.__file__,
          )
          print("FastAPI application:", fastapi_app.title)
          print("PyTorch version:", torch.__version__)
          print("PyTorch CUDA build:", torch.version.cuda)
          print("Runtime dependency imports succeeded.")
          PY

      - name: Show Docker storage usage
        if: always()
        run: |
          echo "Docker storage:"
          docker system df

          echo
          echo "Runner filesystem:"
          df -h

  publish:
    name: Publish Docker image

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    needs:
      - docker

    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Create lowercase image name
        id: image
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=${image_name}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}

          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

          labels: |
            org.opencontainers.image.title=Research Paper Intelligence
            org.opencontainers.image.description=Research paper search and agentic research assistant
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish Docker image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true

          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

          cache-from: |
            type=gha,scope=${{ env.DOCKER_CACHE_SCOPE }}
          cache-to: |
            type=gha,mode=max,scope=${{ env.DOCKER_CACHE_SCOPE }}

          provenance: mode=max
          sbom: true

      - name: Add published image to job summary
        run: |
          {
            echo "## Published Docker image"
            echo
            echo "**Image:** \`${{ steps.image.outputs.name }}\`"
            echo
            echo "**Digest:** \`${{ steps.publish.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"